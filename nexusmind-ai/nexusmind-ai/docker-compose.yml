services:
  neo4j:
    image: neo4j:5.24
    environment: { NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme-local}" }
    ports: ["7474:7474", "7687:7687"]
  backend:
    build: ./backend
    env_file: .env
    environment: { NEO4J_URI: "bolt://neo4j:7687", NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme-local}" }
    ports: ["8000:8000"]
    depends_on: [neo4j]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
